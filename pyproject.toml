[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-book-examples"
version = "0.1.0"
description = "Companion examples for Amazon Nova: Frontier Intelligence by Vishnu VG"
requires-python = ">=3.12"
dependencies = ["boto3==1.44.5", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.5", "pip-audit==2.10.1"]
framework = ["langchain-aws==1.9.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
